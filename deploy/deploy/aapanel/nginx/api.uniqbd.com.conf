# aaPanel → Website → api.uniqbd.com → Config (domain + SSL in aaPanel only)
# App + uploads + .env in /opt/uniqbd.com — proxy to uniqbd-api → 127.0.0.1:4000
# Setup: deploy/deploy/ubuntu22.04/NEW-SERVER-SETUP.md

server {
    listen 80;
    server_name api.uniqbd.com;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /.well-known/ {
        alias /www/wwwroot/api.uniqbd.com/.well-known/;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.uniqbd.com;

    # ssl_certificate    /www/server/panel/vhost/cert/api.uniqbd.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/api.uniqbd.com/privkey.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 25g;

    include /opt/uniqbd.com/deploy/deploy/aapanel/nginx/cloudflare-real-ip.conf;
    # Production is Cloudflare-fronted. Comment out only for DNS-only origin debugging.
    include /opt/uniqbd.com/deploy/deploy/aapanel/nginx/cloudflare-origin-allow.conf;

    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ~ ^/api/admin/media-shares/[^/]+/upload$ {
        client_max_body_size 25g;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    location ^~ /api/media/playback/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    location ~* (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/(apps|packages|deploy|scripts|node_modules|src|dist|coverage)(/|$) { return 404; }
    location ~* ^/(package(-lock)?\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig.*\.json|next\.config\..*|nest-cli\.json|deploy-manifest\.json|README.*|LICENSE)$ { return 404; }
    location ~* \.(env|pem|key|crt|sql|bak|log|map|ts|tsx)$ { return 404; }
}
