# =============================================================================
# api.uniqbd.com — aaPanel full nginx (copy-paste entire file)
# Website → api.uniqbd.com → Config → Select All → Paste → Save → Reload Nginx
# NestJS API :4000 | WebSocket /socket.io/
# =============================================================================

server {
    listen 80;
    server_name api.uniqbd.com;
    include /www/server/panel/vhost/nginx/well-known/api.uniqbd.com.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    http3 on;
    server_name api.uniqbd.com;
    index index.php index.html index.htm default.php default.htm default.html;
    root /www/wwwroot/api.uniqbd.com;
    include /www/server/panel/vhost/nginx/extension/api.uniqbd.com/*.conf;

    #CERT-APPLY-CHECK--START
    # Configuration related to file verification for SSL certificate application - Do not delete
    include /www/server/panel/vhost/nginx/well-known/api.uniqbd.com.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START SSL related configuration, do NOT delete or modify the next line of commented-out 404 rules
    #error_page 404/404.html;
    ssl_certificate    /www/server/panel/vhost/cert/api.uniqbd.com/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/api.uniqbd.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:EECDH+3DES:RSA+3DES:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Alt-Svc 'quic=":443"; h3=":443"; h3-29=":443"; h3-27=":443";h3-25=":443"; h3-T050=":443"; h3-Q050=":443";h3-Q049=":443";h3-Q048=":443"; h3-Q046=":443"; h3-Q043=":443"';
    quic_retry on;
    quic_gso on;
    ssl_early_data off;
    error_page 497  https://$host$request_uri;
    #SSL-END

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20m;

    include /opt/uniqbd.com/deploy/deploy/aapanel/nginx/cloudflare-real-ip.conf;
    # Production is Cloudflare-fronted. Comment out only for DNS-only origin debugging.
    include /opt/uniqbd.com/deploy/deploy/aapanel/nginx/cloudflare-origin-allow.conf;

    #ERROR-PAGE-START  Error page configuration, allowed to be commented, deleted or modified
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    # ---- Live chat WebSocket (Socket.IO) ----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ---- NestJS API (systemd uniqbd-api) ----
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
    }

    #PHP-INFO-START  PHP reference configuration, allowed to be commented, deleted or modified
    location ~ /purge(/.*) {
        proxy_cache_purge cache_one $host$1$is_args$args;
    }
    #PHP-INFO-END

    #REWRITE-START URL rewrite rule reference, any modification will invalidate the rewrite rules set by the panel
    include /www/server/panel/vhost/rewrite/api.uniqbd.com.conf;
    #REWRITE-END

    # Public webroot contains only aaPanel validation/placeholder files.
    # Deny secrets, source, dependency trees and build metadata defensively.
    location ~* (^|/)\.(?!well-known(?:/|$)) { return 404; }
    location ~* ^/(apps|packages|deploy|scripts|node_modules|src|dist|coverage)(/|$) { return 404; }
    location ~* ^/(package(-lock)?\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|tsconfig.*\.json|next\.config\..*|nest-cli\.json|deploy-manifest\.json|README.*|LICENSE)$ { return 404; }
    location ~* \.(env|pem|key|crt|sql|bak|log|map|ts|tsx)$ { return 404; }

    # Directory verification related settings for one-click application for SSL certificate
    location ~ \.well-known{
        allow all;
    }

    #Prohibit putting sensitive files in certificate verification directory
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    access_log  /www/wwwlogs/api.uniqbd.com.log;
    error_log  /www/wwwlogs/api.uniqbd.com.error.log;
}
