# Optional: large admin Samba uploads bypassing Cloudflare's ~100MB proxied limit.
# Cloudflare DNS: A upload → VPS IP, proxy status OFF (grey cloud only).
# apps/web/.env.local: NEXT_PUBLIC_LARGE_UPLOAD_ORIGIN=https://upload.uniqbd.com
# Requires AUTH_COOKIE_DOMAIN=.uniqbd.com and API_CORS_ORIGIN including https://uniqbd.com

server {
    listen 80;
    server_name upload.uniqbd.com;

    location /.well-known/ {
        alias /www/wwwroot/upload.uniqbd.com/.well-known/;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name upload.uniqbd.com;

    # ssl_certificate    /www/server/panel/vhost/cert/upload.uniqbd.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/upload.uniqbd.com/privkey.pem;

    client_max_body_size 25g;

    # Admin UI on uniqbd.com posts uploads here (cross-origin, credentials + optional CSRF).
    location ^~ /api/smb-media-upload/ {
        client_max_body_size 25g;
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://uniqbd.com" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-CSRF-Token" always;
            add_header Content-Length 0;
            return 204;
        }
        add_header Access-Control-Allow-Origin "https://uniqbd.com" always;
        add_header Access-Control-Allow-Credentials "true" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    location /api/admin/media-shares/ {
        client_max_body_size 25g;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}

